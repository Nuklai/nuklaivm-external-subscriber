log_level: "info"

server:
  host: "0.0.0.0"
  port: 8080
  enable_tls: false
  cert_file: ""
  key_file: ""
  enable_rate_limiting: true
  requests_per_minute: 100

database:
  host: "localhost"
  port: 5432
  username: "postgres"
  password: "postgres"
  database: "nuklai_indexer"
  ssl_mode: "disable"
  max_open_connections: 25
  max_idle_connections: 5
  connection_max_lifetime: "1h"

blockchain:
  rpc_endpoints:
    - "http://localhost:26657"
  start_height: 1
  sync_concurrency: 10
  fetch_interval: "1s"
  fetch_timeout: "10s"