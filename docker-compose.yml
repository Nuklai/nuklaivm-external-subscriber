networks:
  nuklaivm-network:
    external: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nuklai_indexer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment this section if you want to use Adminer to manage the database
  # adminer:
  #   image: adminer
  #   ports:
  #     - "8081:8080"
  #   depends_on:
  #     - postgres

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Indexer service (uncomment when ready to deploy)
  # indexer:
  #   build: .
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./config:/app/config
  #   environment:
  #     - NUKLAI_INDEXER_LOG_LEVEL=debug
  #     - NUKLAI_INDEXER_DATABASE_HOST=postgres
  #     - NUKLAI_INDEXER_DATABASE_PORT=5432
  #     - NUKLAI_INDEXER_DATABASE_USERNAME=postgres
  #     - NUKLAI_INDEXER_DATABASE_PASSWORD=postgres
  #     - NUKLAI_INDEXER_DATABASE_DATABASE=nuklai_indexer

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
